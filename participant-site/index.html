
<!-- FILE: participant/participant.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innopoll | Participant Survey</title>

  <link rel="stylesheet" href="./styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./participant.js" defer></script>
</head>
<body class="participant-body">
  <main class="participant-container">
    <header class="brand-header">
      <div class="brand-mark">I</div>
      <span>Innopoll</span>
    </header>

    <section id="welcome-screen" class="survey-card">
      <p class="eyebrow">INNOVATION READINESS POLL</p>
      <h1>Innopoll</h1>
      <p class="muted">
        Share your perspective on innovation in your organisation.
        This survey takes approximately 3–5 minutes.
      </p>
      <button id="join-button" class="primary-button full-width">
        Join Survey
      </button>
      <p id="welcome-error" class="error-message" role="alert"></p>
    </section>

    <section id="question-screen" class="survey-card hidden">
      <div class="question-topline">
        <span id="category-label" class="eyebrow">CULTURE</span>
        <span id="progress-label" class="muted small-text">1 of 3</span>
      </div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <h1 id="question-title">Culture</h1>
      <p id="category-description" class="muted"></p>
      <h2 id="question-text" class="question-text"></h2>

      <form id="answer-form">
        <div id="answer-options" class="answer-options"></div>
        <p id="answer-error" class="error-message" role="alert"></p>
        <button type="submit" id="next-button" class="primary-button full-width">
          Next
        </button>
      </form>
    </section>

    <section id="success-screen" class="survey-card hidden">
      <div class="success-icon" aria-hidden="true">✓</div>
      <h1>Innopoll</h1>
      <p class="success-message">Response submitted successfully</p>
      <p class="muted">Thank you for sharing your perspective.</p>
    </section>

    <footer class="survey-footer">Innopoll · Innovation Readiness</footer>
  </main>
</body>
</html>
