<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7f8" />
  <title>Innopoll | Participant Survey</title>

  <link rel="stylesheet" href="./styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./participant.js" defer></script>
</head>

<body class="participant-body">
  <main class="participant-container">

    <!-- Landing page -->
    <section id="welcome-screen" class="survey-card welcome-card">
      <div class="wordmark">INNOPOLL</div>

      <p class="welcome-description">
        Share your perspective on innovation in your organisation.
        This survey takes approximately <strong>3–5 minutes</strong>.
      </p>

      <button id="join-button" class="primary-button full-width">
        Start Survey
      </button>

      <p id="welcome-error" class="error-message" role="alert"></p>
    </section>

    <!-- Category introduction -->
    <section id="category-description-screen" class="survey-card hidden">
      <h1 id="category-description-title" class="category-title">
        INNOVATION CULTURE
      </h1>

      <p id="category-description-text" class="category-intro-text"></p>

      <button
        type="button"
        id="description-next-button"
        class="primary-button full-width"
      >
        Continue
      </button>
    </section>

    <!-- Question -->
    <section id="question-screen" class="survey-card hidden">
      <div class="question-topline">
        <span class="progress-label">QUESTION</span>
        <span id="progress-label" class="muted small-text">1 of 3</span>
      </div>

      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <h2 id="question-text" class="question-text"></h2>

      <details class="definition-dropdown">
        <summary>
          <span>View Definition</span>
          <span class="definition-chevron" aria-hidden="true"></span>
        </summary>
        <p id="question-definition" class="definition-text"></p>
      </details>

      <form id="answer-form">
        <div id="answer-options" class="answer-options"></div>

        <p id="answer-error" class="error-message" role="alert"></p>

        <button
          type="submit"
          id="next-button"
          class="primary-button full-width"
        >
          Next
        </button>
      </form>
    </section>

    <!-- Thank-you page -->
    <section id="success-screen" class="survey-card success-card hidden">
      <h1 class="success-title">THANK YOU!</h1>

      <p class="success-message">
        Response submitted successfully
      </p>

      <button
        type="button"
        id="view-results-button"
        class="primary-button full-width"
      >
        View Results
      </button>
    </section>

    <!-- Poll results -->
    <section id="results-screen" class="results-page hidden">
      <h1 class="results-heading">Poll Results</h1>
      <div id="results-content" class="personal-results"></div>
    </section>

    <footer class="survey-footer">
      Innopoll
    </footer>

  </main>
</body>
</html>
